name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Checkout the optional third_party/qvis submodule when registered;
          # scripts/build-qvis-if-present.js and scripts/build.js fall back to
          # the published @pmeenan/qvis package in node_modules when absent.
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm test -- --run

      - run: npm run test:browser

      - run: npm run build

      - run: npm audit --audit-level=moderate
